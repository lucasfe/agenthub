name: Ralph release

# End-to-end automation for @lucasfe/ralph releases.
#
# Flow on every push to main:
#   1. release-please inspects commits since the last ralph release. If
#      it finds user-facing CC types (`feat:` / `fix:`), it opens (or
#      updates) a Release PR that bumps `packages/ralph/package.json`
#      and prepends a CHANGELOG entry.
#   2. auto-merge-release-pr posts a `PR Title` success status on the
#      Release PR (the required gate never fires on a token-authored PR)
#      and enables squash auto-merge. Once required checks pass, GitHub
#      merges it. The merge triggers another `push: main` event → this
#      workflow runs again.
#   3. publish (always-run, idempotent): reads
#      `packages/ralph/package.json`, asks npm if that exact version is
#      already published, and publishes only if it isn't. This is the
#      safety net — if release-please's Release PR merged and the new
#      version isn't on npm yet, this job fills the gap. If the version
#      is already there, it's a no-op.
#
# No manual Release PR review. No `--admin` clicks.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.release.outputs['packages/ralph--pr'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  auto-merge-release-pr:
    name: Auto-merge release-please PR
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Needed to post the `PR Title` commit status (see below).
      statuses: write
    steps:
      - name: Satisfy the PR Title gate and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Don't trust release-please's output — when its Release PR
          # already exists from a previous run with no new updates, it
          # doesn't re-emit `pr_number`. Query open PRs whose head
          # branch matches the release-please naming convention instead.
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --base main \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open release-please PR found — nothing to auto-merge."
            exit 0
          fi

          echo "Found open release-please PR #$PR_NUMBER."

          # The `PR Title` check (CI's pr-title job) is a REQUIRED status
          # on `main`, but it NEVER runs on this PR: release-please opened
          # it with the default GITHUB_TOKEN, and GitHub suppresses
          # workflow triggers for token-authored events (anti-recursion).
          # The old close/reopen trick to re-fire it didn't work either —
          # that reopen is ALSO a GITHUB_TOKEN action, so it's suppressed
          # too. So the gate stays forever pending → PR is BLOCKED →
          # every release needed a manual `gh pr merge --admin`.
          #
          # Branch protection matches a required context by NAME and
          # accepts a plain commit status, not only a check-run. So we
          # validate the title ourselves (release-please always emits a
          # valid Conventional Commit like `chore(main): release ...`)
          # and post a `PR Title` success status directly on the head
          # SHA. This runs on the `push` event, where GITHUB_TOKEN is
          # free to write statuses. Release PRs are thus excluded from
          # the human-authored title gate without weakening it for normal
          # dev → main PRs (those still run the real pr-title job).
          TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title -q .title)
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)
          echo "Title: $TITLE"
          echo "Head SHA: $HEAD_SHA"

          # Guard: only vouch for genuinely valid Conventional Commit
          # titles, so a malformed release PR still blocks.
          if ! echo "$TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert)(\([^)]+\))?!?: .+'; then
            echo "::error::Release PR title is not a valid Conventional Commit: $TITLE"
            exit 1
          fi

          gh api \
            --method POST \
            "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context='PR Title' \
            -f description='Release PR title validated by ralph-release workflow'

          # Enable auto-merge so GitHub merges once required checks pass.
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --auto

  publish:
    name: Publish @lucasfe/ralph to npm (match-publish safety net)
    needs: release-please
    # Run even when no Release PR was created — the previous run already
    # auto-merged a Release PR and bumped package.json; this run sees
    # the new version and publishes. Idempotent: skips if already
    # published.
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/ralph
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships with npm >= 11, required for trusted publishing (OIDC).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/ralph/package-lock.json

      - name: Check whether current package.json version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@lucasfe/ralph@$VERSION" version 2>/dev/null | grep -q "^$VERSION$"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm — nothing to do."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on npm — will publish."
          fi

      - name: Install dependencies
        if: steps.check.outputs.already_published == 'false'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.already_published == 'false'
        run: npm test

      - name: Publish to npm via OIDC (Trusted Publisher)
        if: steps.check.outputs.already_published == 'false'
        run: |
          VERSION='${{ steps.check.outputs.version }}'
          if [[ "$VERSION" == *-* ]]; then
            # Prereleases (0.4.0-rc.1, 0.5.0-beta.2, …) go to the `rc`
            # dist-tag so `latest` keeps pointing at the most recent
            # stable.
            npm publish --access public --provenance --tag rc
          else
            npm publish --access public --provenance
          fi
